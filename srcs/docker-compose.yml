services:
  nginx:
    build: ./requirements/nginx/.
    container_name: nginx
    ports:
      - "443:443"
    restart: always
    env_file:
      - .env # Make sure you create this .env file with your DOMAIN_NAME
    volumes:
      - /home/erigonza/data/wordpress:/var/www/html # Shared volume for WordPress files
    networks:
      - neterik
    depends_on:
      - wordpress

  wordpress:
    build: ./requirements/wordpress/.
    container_name: wordpress
    # REMOVE THIS LINE: - "9000:9000" <--- php-fpm should NOT be exposed
    restart: always
    # env_file: # This isn't strictly needed for a non-functional WP without DB, but keep if you've got it
    #   - .env
    volumes:
      - /home/erigonza/data/wordpress:/var/www/html # Same shared volume for WordPress files
    networks:
      - neterik
    # REMOVE THIS LINE: depends_on: - mariadb # No mariadb service to depend on

networks:
  neterik:
    driver: bridge